

<!--
  BoldHearts Leadership Team Culture Assessment
  Version: v4.1
  Last updated: 2026-07-03

  CHANGELOG:
  v1.0 — Initial build
    - 3 circles: Relationships, Values, Calling
    - Each circle: 4 Receiving + 4 Giving questions (8 per circle, 24 total)
    - Each question rated twice: Current state + Ideal state (48 total ratings)
    - Slider UI matching relational.html / interior.html (hash marks, no numbers)
    - Test mode via ?test=true
    - Submits to Google Apps Script (action=leadershipteam) -> "LeadershipTeam" tab

  v1.1 — Flow restructure
    - Name/email/team gate now collected UP FRONT, before the survey begins
      (prevents typo'd team names from splitting aggregated data later, and
      means we know who's mid-assessment)
    - After submission, person now sees THEIR OWN individual results page:
      personal Venn position, personal radar chart, give/receive bars,
      and an auto-generated reflection paragraph based on their specific
      give/receive pattern and biggest current-vs-ideal gap
    - Results page explicitly labeled "Your View" with framing that the
      full team comparison comes later in the facilitated debrief
    - Old "thank you only" screen removed in favor of this richer single-
      person reveal

  v1.2 — Test mode fix
    - Added ?test=write mode: auto-fills randomized answers AND submits
      to the Google Sheet (for verifying the Apps Script connection
      without manually moving 64 sliders)
    - ?test=true continues to preview results WITHOUT writing to sheet
    - Both test modes now correctly skip the intro gate and survey
      entirely, jumping straight to finalizeSubmission()

  v1.3 — Sheet write reliability fix
    - Replaced fetch(...,{mode:'no-cors'}) with new Image().src beacon
      for the sheet submission call. Direct curl/browser test of the
      Apps Script URL confirmed the script itself works correctly
      ({"status":"ok"}), but the page's fetch() call was not reliably
      reaching it (likely blocked by browser/extension no-cors handling).
      Image beacon pattern matches what other BoldHearts assessment
      pages already use for fire-and-forget submissions.

  v1.4 — Raw answer capture
    - Previously only calculated scores (current/ideal % per circle)
      were saved. Now all 48 raw individual answers (24 questions x
      2 ratings) are also submitted, matching the pattern used by
      relational.html / interior.html.

  v1.5 — Results page redesign
    - Replaced Venn diagram + radar chart with 3 clean bar pairs
      (one per circle: Relationships, Values, Calling), each showing
      current and ideal side by side with tier labels (Strong/Present/
      Thin/Quiet/Barely There) and cool-to-warm color system
    - Added dynamic "Worth Sitting With" reflection paragraph
      generated from actual scores: names strongest circle with
      agreePhrase language, names biggest current-vs-ideal gap circle
    - Removed Venn, radar, give/receive bars, buildReflection function,
      starPath, computeVennPos -- all replaced by simpler barPair format

  v1.6 — Relationships circle rewritten to match 8-dimension framework
    - Previous Relationships questions used abstract identity language
      ("who I am," "who they are," "friends") that different respondents
      would resolve differently before answering, and had unintentional
      overlap (two questions both testing general connection/inclusion,
      four of the eight core relational dimensions unused entirely)
    - Rewritten against the same 8-dimension model used in the personal
      Relationship-with-Self / Relationship-with-Others assessments:
      Being Seen, Being Known, Trust & Safety, Receiving Support (Receiving)
      and Having a Voice, Belonging, Freedom, Being Chosen (Giving)
    - Each question now names a concrete, checkable behavior or fact
      instead of an abstract identity claim, and each dimension appears
      exactly once — no overlap, no gaps

  v1.7 — Values circle rewritten against 8-realm lifecycle model
    - Previous Values questions had double-barreled items (two claims
      in one sentence), items that assumed an unwitnessed event had
      occurred (a concern being raised, a costly moment happening),
      and framing language that shifted the actual construct being
      measured ("I am the one who raises it" implying uniqueness)
    - Rewritten against a new 8-realm model specific to values/conviction
      (distinct from the relational 8-dimension model used in
      Relationships): Known, Communicated, Integrated, Defended
      (Receiving) and Agreed Upon, Acted Upon, Costly, Sustained (Giving)
    - Each realm appears exactly once; belief/confidence framing used
      in place of event-conditional framing where an assumed event
      would otherwise leave some respondents with nothing to answer

  v1.8 — Calling circle replaced with gifting/utilization realm model
    - Previous Calling questions tested only team-level mission clarity
      and direction ("do we know where we're headed") — none of them
      measured whether an individual's specific gifting was recognized,
      well-placed, or actually being used, which is a separate and
      more predictive driver of a leader's satisfaction on a team
    - Replaced entirely with an 8-realm gifting model: Recognized,
      Positioned, Utilized, Growing (Receiving) and Known, Aligned,
      Contributing, Energized (Giving)
    - Circle description updated to match; "Before the Debrief" Calling
      prompt updated from mission-articulation framing to a
      gifting/fit framing to stay consistent with the new questions

  v1.9 — Calling questions refined for trait-vs-environment and
         event-conditional issues
    - "Known" (I know what my strongest gifts actually are) replaced —
      it was a pure self-knowledge trait question disconnected from
      the team, meaning the "should" side reliably ceilings near-max
      for every respondent regardless of team quality, making the
      current/ideal gap add little real insight. Replaced with a
      team-context version: "I understand why I was chosen for this
      team — how my specific gifting and calling fit into what we're
      doing" — now the "should" side genuinely varies based on whether
      the team has actually communicated that fit.
    - "Aligned" reworded from "connects directly to where this team is
      headed" (depends on the team having an articulated forward
      direction) to "aligns well with the intent and purpose of this
      team" — purpose is more foundational than direction and doesn't
      require the team to have done separate mission-clarity work.
    - "Contributing" reworded from "I can point to something specific
      my gifts have produced" (event-conditional — a respondent with
      no single visible win has nothing honest to report) to "My gifts
      and calling actually shape the decisions this team makes" — an
      ongoing-influence question instead of one requiring a discrete
      instance, and narrowed from a three-part list (decisions/
      meetings/impacts) to one clean construct.

  v2.0 — Removed "What I Receive From This Team" / "What I Give To
         This Team" subgroup headers
    - These labels sat directly above each group of questions and
      risked cueing respondents to consciously perform or rate
      themselves generously on the "Giving" half specifically, since
      the label made it explicit they were now being asked to grade
      their own contribution rather than the team's
    - Question order is unchanged (outward/receiving questions still
      render before self/giving questions within each circle) — only
      the visible header text announcing the split was removed
    - The general receiving/giving explanation in the intro paragraph
      above the survey (in the "A Few Things Before You Start" block)
      was left in place, since it's positioned before any individual
      question and doesn't sit directly over a specific rating the
      way the removed subgroup headers did

  v2.1 — Removed tier-label text (Thriving/Healthy/Developing/etc.)
         from the give/receive rows in the results page
    - Current/Ideal bar pairs still show tier labels since those
      describe the team's overall state, which is an appropriate
      thing to label
    - Give/receive rows describe an individual's personal giving and
      receiving pattern, and a label like "Developing" sitting next to
      a personal score reads as a judgment on the person rather than
      a description of the team, so it was removed. The bars and
      colors still convey relative strength without the added label.

  v2.2 — Values "Known" and "Integrated" questions rewritten to be
         team-directed rather than self- or structure-focused
    - "Known" changed from "I could list this team's core values
      without having to stop and think" (a self-recall trait question
      with the same weak "should" signal issue found elsewhere) to
      "The team has shared its core values with me clearly enough
      that I didn't have to guess or piece them together on my own" —
      now describes an action the team took toward the respondent
    - "Integrated" changed from "This team's values show up in how we
      actually make decisions" (a structural/collective claim not
      about the respondent specifically) to "I trust that if a
      decision affected me personally, this team's values would
      actually shape how it was handled" — a belief-based, personal
      version that avoids the event-conditional trap (no requirement
      that such a decision has actually happened yet)
    - Both changes support relabeling Values' Receiving group as "the
      team initiated with me" instead of "I receive" going forward

  v2.3 — Calling's Receiving questions rewritten to be team-directed,
         matching the same fix applied to Values
    - "Positioned" changed from "I am in a role on this team that
      actually fits how I'm wired" (a state, no clear actor) to
      "This team has me in a role that actually fits how I'm wired" —
      present-tense so it doesn't hinge on who made a past placement
      decision, only who's responsible for it now
    - "Utilized" changed from "I get to use my strongest gifts
      regularly on this team" to "This team gives me regular
      opportunities to use my strongest gifts, not just occasionally"
    - "Growing" changed from "My gifts are developing because of my
      time on this team, not stagnating" to "This team actively
      invests in growing my gifts, rather than leaving me to develop
      them on my own"
    - "Recognized" was already team-directed and left unchanged
    - All four Receiving questions across both Values and Calling now
      consistently name the team as the actor, supporting a uniform
      "the team initiated with me" / "I initiate with the team" label
      pair across all three circles (Relationships keeps its own
      relationship-specific initiating language)

  v2.4 — Results page "Your Relationship With This Team" section
         overhauled: current+ideal added, Worth Naming expanded
    - Replaced giveReceiveRow (2 bars: I receive / I give, current
      only) with initiateRow (4 bars: I initiate current+ideal, The
      team initiates current+ideal), using per-circle label wording —
      "I initiate with team" / "The team initiates with me" for
      Relationships, "I initiate with the team" / "The team initiated
      with me" for Values and Calling
    - Removed tier-label text from these rows in v2.1 remains in
      effect; only bar length/color now convey relative strength
    - Worth Naming reflection expanded from a single imbalance-only
      paragraph to three: (1) the respondent's strongest circle for
      self-initiated engagement, (2) the circle where the team has
      initiated with the respondent the most, (3) the circle with the
      widest gap between the two, when that gap is meaningful (>=15
      points) — surfacing personal strength, team strength, and the
      biggest opportunity in one card instead of only imbalance
    - Removed the old balanced-scores fallback branch since the first
      two Worth Naming paragraphs are now always populated regardless
      of imbalance, making the fallback unreachable dead code
    - Section intro line reworded from "what you draw from this team
      and what you put back into it" to "what you initiate toward
      this team, and what this team initiates toward you" to match
      the new framing throughout

  v2.5 — "Things to Consider" reworded: removed agreePhrase language,
         which produced a self-contradicting sentence
    - Old wording called the top-scoring circle "your strongest area"
      and then described its score using agreePhrase(), which for a
      middling score (40-59%) reads as "closer to the middle" —
      producing an incoherent sentence that praised an area while
      simultaneously describing it as mediocre
    - Replaced with direct, plain naming: "Your strongest area
      currently is within X. The biggest disconnect between your
      current state and your ideal state is in Y. Both of these are
      worth naming with your team." No score-intensity language, no
      risk of contradiction — states the two facts and stops
    - agreePhrase() function itself left in place (unused) rather than
      deleted, consistent with how other now-unused code (qnum CSS
      class, subgroup-label CSS class) was left rather than pulled,
      since removing dead code carries edit risk for no behavior gain

  v2.6 — Worth Naming expanded from 2-3 paragraphs to up to 5,
         covering growth gaps in both directions; threshold lowered
    - Added "my biggest growth gap" — the circle with the widest
      current-vs-ideal gap specifically within the respondent's own
      initiating (self current vs self ideal), separate from the
      circle-level current/ideal gap already shown in "Things to
      Consider" (which is the blended current/ideal, not self-only)
    - Added "the team's biggest growth gap" — same computation using
      the team's outward current vs outward ideal, surfacing where the
      team most needs to grow in initiating toward the respondent
    - Imbalance threshold (self vs outward current, within a circle)
      lowered from 15 points to 10, and extracted into a named
      IMBALANCE_THRESHOLD constant reused by all three gap checks
      (personal growth, team growth, imbalance) for consistency
    - Existing two strength paragraphs (myStrongest, teamStrongest)
      left unconditional as before; the three gap paragraphs are each
      independently gated behind the 10-point threshold, so a
      respondent with no meaningful gaps still sees the two strength
      paragraphs without empty or forced gap commentary

  v2.7 — "Things to Consider" and "Worth Naming" reworded to read as
         the respondent's perception, not stated fact about the team
    - Every declarative claim ("X is your strongest area", "the team's
      biggest strength is X") replaced with perception-framed language
      ("based on how you answered, X feels like...", "your answers
      suggest...", "you feel...") so the results page consistently
      reads as a reflection of one person's self-report rather than an
      objective verdict on the team
    - Applies to all 5 Worth Naming paragraphs and both Things to
      Consider branches (with-gap and no-gap versions)
    - Bar labels (Current/Ideal, tier labels like Developing/Healthy/
      Thriving) were left unchanged — those are direct restatements of
      the respondent's own slider positions, not interpretive claims,
      so they don't carry the same fact-vs-perception ambiguity
-->

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwAyuLIUf-wpSdNzFla_Uf72UsgytUrSXSWcw55Lspi7az2ypZlhZNyR4O6ED80SMGsJA/exec';

const CIRCLES = [
  {id:'relationships', label:'Relationships', color:'#D85A30', icon:'ti-users',
   desc:"Does this team genuinely know, trust, and enjoy each other — not just work well together?",
   outward:[
    "People on this team notice when something's going on with me, even before I say anything.",
    "The people on this team know what actually drives me — not just what I do, but why I do it.",
    "I feel safe being honest with this team when something is wrong.",
    "If I were struggling personally, I believe this team would show up for me."
   ],
   self:[
    "When I disagree with someone on this team, I initiate the conversation rather than letting distance grow.",
    "When this team has gone through something hard together, it's made me more invested in these people, not less.",
    "I show up as the same person in front of this team as I am anywhere else — no performing, no hiding.",
    "There are people on this team I actively seek out — not because I have to work with them, but because I want to."
   ]},
  {id:'values', label:'Values', color:'#185FA5', icon:'ti-compass',
   desc:"Does this team share real, lived convictions — not just stated principles?",
   outward:[
    "The team has shared its core values with me clearly enough that I didn't have to guess or piece them together on my own.",
    "This team talks about its values regularly — not just once a year or when something goes wrong.",
    "I trust that if a decision affected me personally, this team's values would actually shape how it was handled.",
    "I believe someone on this team would speak up if one of our values were being violated."
   ],
   self:[
    "I genuinely believe in this team's stated values — I'm not just going along with them.",
    "My day-to-day decisions on this team actually reflect our stated values, not just my convenience.",
    "I am willing to pay a real personal cost — time, comfort, a relationship — to stay true to this team's values.",
    "I actively work to keep this team's values alive, rather than assuming they'll hold on their own."
   ]},
  {id:'calling', label:'Calling', color:'#534AB7', icon:'ti-flag',
   desc:"Are people on this team actually known for their gifting, positioned to use it, and growing because of it — not just busy?",
   outward:[
    "The people on this team recognize and name my specific gifts, not just what I get done.",
    "This team has me in a role that actually fits how I'm wired.",
    "This team gives me regular opportunities to use my strongest gifts, not just occasionally.",
    "This team actively invests in growing my gifts, rather than leaving me to develop them on my own."
   ],
   self:[
    "I understand why I was chosen for this team — how my specific gifting and calling fit into what we're doing.",
    "My calling aligns well with the intent and purpose of this team.",
    "My gifts and calling actually shape the decisions this team makes.",
    "Using my gifts on this team gives me energy more than it drains me."

];

let answers = {}, userName = '', userEmail = '', teamName = '', assessmentRound = '', isTestMode = false;

function totalQs(){ return CIRCLES.reduce((a,c)=>a+c.outward.length+c.self.length,0) * 2; }
function totalAns(){ return Object.keys(answers).length; }

function updateProgress(){
  const pct = Math.round((totalAns()/totalQs())*100);
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('progress-lbl').textContent = totalAns()+' of '+totalQs()+' answered';
}

const HASH_ROW = '<div class="hash-row">'+'<div class="hash-mark"></div>'.repeat(7)+'</div>';

// ── INTRO GATE — collected FIRST, before survey ──────────────

  document.getElementById('top-divider').style.display = 'none';

  g += '<div class="gate-field"><label>Your Email Address</label><input type="email" id="gemail" placeholder="you@example.com"></div>';

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'ground'){
    document.getElementById('ground-custom-wrap').style.display = e.target.value === 'Custom' ? '' : 'none';
  }
});

function submitIntroGate(){
  const name=document.getElementById('gname').value.trim();
  const email=document.getElementById('gemail').value.trim();
  const tname=document.getElementById('tname').value.trim();
  const groundEl=document.getElementById('ground');
  const roundName=groundEl.value==='Custom'?document.getElementById('ground-custom').value.trim():groundEl.value;
  const err=document.getElementById('intro-err');
  if(!name){err.textContent='Please enter your first name.';return;}
  if(!email||!email.includes('@')){err.textContent='Please enter a valid email.';return;}
  if(!tname){err.textContent='Please enter your team or organization name.';return;}
  if(!roundName){err.textContent='Please enter a round name.';return;}
  userName=name;userEmail=email;teamName=tname;assessmentRound=roundName;
  document.getElementById('progress-section').style.display='';
  renderSurvey();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuestionBlock(c, groupKey, q, idx){
  const curK = c.id+'_'+groupKey+'_'+idx+'_cur';
  const idealK = c.id+'_'+groupKey+'_'+idx+'_ideal';
  const curHas = answers[curK]!==undefined;
  const idealHas = answers[idealK]!==undefined;
  let html = '<div class="qblock'+((curHas&&idealHas)?' answered':'')+'" id="q_'+c.id+'_'+groupKey+'_'+idx+'">';
  html += '<div class="qlabel">'+q+'</div>';
  html += '<div class="rating-row"><div class="rating-label">How true is this right now?</div>';
  html += '<div class="scale-endlabels"><span class="scale-endlabel">Strongly disagree</span><span class="scale-endlabel">Strongly agree</span></div>';
  html += '<div class="slider-area"><input type="range" min="1" max="7" step="0.01" value="'+(curHas?answers[curK]:'1')+'" class="cur-thumb" id="sl_'+curK+'" style="opacity:'+(curHas?'1':'.4')+'" oninput="onSlide(\''+curK+'\')" onchange="onCommit(\''+curK+'\',this.value)">'+HASH_ROW+'</div></div>';
  html += '<div class="rating-row"><div class="rating-label">How true do you want this to be for your team?</div>';
  html += '<div class="scale-endlabels"><span class="scale-endlabel">Strongly disagree</span><span class="scale-endlabel">Strongly agree</span></div>';
  html += '<div class="slider-area"><input type="range" min="1" max="7" step="0.01" value="'+(idealHas?answers[idealK]:'1')+'" class="ideal-thumb" id="sl_'+idealK+'" style="opacity:'+(idealHas?'1':'.4')+'" oninput="onSlide(\''+idealK+'\')" onchange="onCommit(\''+idealK+'\',this.value)">'+HASH_ROW+'</div></div>';
  html += '</div>';
  return html;
}

function renderSurvey(){
  let html = '<div class="main">';
  html += '<div style="padding:2rem;background:#1e1c1a;border:1px solid rgba(232,215,160,.2);border-left:4px solid #e8d7a0;border-radius:4px;margin-bottom:2rem">';
  html += '<div style="font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:#e8d7a0;margin-bottom:.75rem;font-weight:500">A Few Things Before You Start</div>';
  html += '<p style="font-size:.92rem;color:#c0b8b0;line-height:1.9;margin-bottom:.75rem">Each question is asked twice &mdash; how true this is for your team right now, and how true you want it to be for your team. That second question isn\'t about some abstract "healthy team" out there — it\'s about what you actually want from this specific group of people. The gap between those two answers is often more revealing than either number alone.</p>';
  html += '<p style="font-size:.92rem;color:#c0b8b0;line-height:1.9;margin-bottom:.75rem">Within each area, some questions ask what you receive from this team &mdash; and others ask what you actually give to it. Both matter. A team can look healthy on paper while a few people quietly carry the weight of holding it together.</p>';
  html += '<p style="font-size:.92rem;color:#c0b8b0;line-height:1.9;margin:0">Answer honestly, not diplomatically.</p>';
  html += '</div>';
  CIRCLES.forEach(c=>{
    html += '<div class="realm-hdr"><div class="realm-icon" style="color:'+c.color+'"><i class="ti '+c.icon+'"></i></div><div class="realm-hdr-text"><h2>'+c.label+'</h2><p>'+c.desc+'</p></div></div>';
    c.outward.forEach((q,i)=>{ html += renderQuestionBlock(c,'outward',q,i); });
    c.self.forEach((q,i)=>{ html += renderQuestionBlock(c,'self',q,i); });
  });
  html += '<div class="submit-section"><div class="submit-meta">Move every slider to answer &mdash; your honest perspective matters more than a flattering score</div><button class="sub-btn" onclick="trySubmit()">Submit My Responses &rarr;</button><div class="errmsg" id="errmsg"></div></div></div>';
  document.getElementById('app').innerHTML = html;
  updateProgress();
}

function onSlide(k){ document.getElementById('sl_'+k).style.opacity = '1'; }

function onCommit(k, val){
  answers[k] = parseFloat(val);
  const parts = k.split('_');
  const blockId = 'q_'+parts[0]+'_'+parts[1]+'_'+parts[2];
  const curK = parts[0]+'_'+parts[1]+'_'+parts[2]+'_cur';
  const idealK = parts[0]+'_'+parts[1]+'_'+parts[2]+'_ideal';
  if(answers[curK]!==undefined && answers[idealK]!==undefined){
    document.getElementById(blockId)?.classList.add('answered');
  }
  updateProgress();
  document.getElementById('errmsg').textContent='';
}

function trySubmit(){
  const unanswered=[];
  CIRCLES.forEach(c=>{
    ['outward','self'].forEach(grp=>{
      c[grp].forEach((_,i)=>{
        if(answers[c.id+'_'+grp+'_'+i+'_cur']===undefined) unanswered.push(1);
        if(answers[c.id+'_'+grp+'_'+i+'_ideal']===undefined) unanswered.push(1);
      });
    });
  });
  if(unanswered.length>0){
    document.getElementById('errmsg').textContent = unanswered.length+' rating'+(unanswered.length>1?'s':'')+' still need'+(unanswered.length===1?'s':'')+' an answer.';
    return;
  }
  finalizeSubmission();
}

function calcScores(){
  const result = {};
  CIRCLES.forEach(c=>{
    const groupScore = (grp, rating) => {
      let t=0,n=0;
      c[grp].forEach((_,i)=>{
        const v = answers[c.id+'_'+grp+'_'+i+'_'+rating];
        if(v!==undefined){t+=v;n++;}
      });
      return n>0?Math.round((t/(n*7))*100):0;
    };
    const outCur=groupScore('outward','cur'), outIdeal=groupScore('outward','ideal');
    const selfCur=groupScore('self','cur'), selfIdeal=groupScore('self','ideal');
    result[c.id] = {
      current: Math.round((outCur+selfCur)/2),
      ideal: Math.round((outIdeal+selfIdeal)/2),
      outwardCurrent: outCur, outwardIdeal: outIdeal,
      selfCurrent: selfCur, selfIdeal: selfIdeal
    };
  });
  return result;
}

function buildRawAnswerParams(){
  const raw = {};
  CIRCLES.forEach(c=>{
    ['outward','self'].forEach(grp=>{
      c[grp].forEach((_,i)=>{
        raw[c.id+'_'+grp+'_'+i+'_cur'] = answers[c.id+'_'+grp+'_'+i+'_cur'] ?? '';
        raw[c.id+'_'+grp+'_'+i+'_ideal'] = answers[c.id+'_'+grp+'_'+i+'_ideal'] ?? '';
      });
    });
  });
  return raw;
}

function finalizeSubmission(){
  const scores = calcScores();

  if(!isTestMode){
    const rawParams = buildRawAnswerParams();
    const params = new URLSearchParams({
      action:'leadershipteam', name:userName, email:userEmail, team:teamName, round:assessmentRound,
      rel_current: scores.relationships.current+'%', rel_ideal: scores.relationships.ideal+'%',
      rel_out_current: scores.relationships.outwardCurrent+'%', rel_out_ideal: scores.relationships.outwardIdeal+'%',
      rel_self_current: scores.relationships.selfCurrent+'%', rel_self_ideal: scores.relationships.selfIdeal+'%',
      values_current: scores.values.current+'%', values_ideal: scores.values.ideal+'%',
      values_out_current: scores.values.outwardCurrent+'%', values_out_ideal: scores.values.outwardIdeal+'%',
      values_self_current: scores.values.selfCurrent+'%', values_self_ideal: scores.values.selfIdeal+'%',
      calling_current: scores.calling.current+'%', calling_ideal: scores.calling.ideal+'%',
      calling_out_current: scores.calling.outwardCurrent+'%', calling_out_ideal: scores.calling.outwardIdeal+'%',
      calling_self_current: scores.calling.selfCurrent+'%', calling_self_ideal: scores.calling.selfIdeal+'%',
      ...rawParams
    });
    new Image().src = SHEETS_URL+'?'+params.toString();
  }

  renderResults(scores);
  document.getElementById('progress-section').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── REFLECTION NUGGET — removed in v1.5 (replaced by inline writeup in renderResults) ──
function buildReflection(scores){
  const circles = [
    {label:'Relationships', ...scores.relationships},
    {label:'Values', ...scores.values},
    {label:'Calling', ...scores.calling}
  ];

  const paragraphs = [];

  // 1. Give/Receive imbalance — averaged across all 3 circles
  const avgOutCur = Math.round((scores.relationships.outwardCurrent + scores.values.outwardCurrent + scores.calling.outwardCurrent) / 3);
  const avgSelfCur = Math.round((scores.relationships.selfCurrent + scores.values.selfCurrent + scores.calling.selfCurrent) / 3);
  const giveReceiveGap = avgOutCur - avgSelfCur;

  if(giveReceiveGap >= 15){
    paragraphs.push('Across all three areas, what you receive from this team currently outpaces what you actively give to it. That isn\'t a verdict &mdash; but it is worth sitting with. You may be benefiting from a culture you haven\'t yet fully invested back into.');
  } else if(giveReceiveGap <= -15){
    paragraphs.push('Across all three areas, what you give to this team currently outpaces what you feel you receive back. You may be one of the people quietly carrying this team\'s culture &mdash; worth naming in the group conversation rather than carrying alone.');
  } else {
    paragraphs.push('What you give to this team and what you receive from it are fairly balanced right now &mdash; that mutuality is worth noticing and protecting.');
  }

  // 2. Biggest current-vs-ideal gap
  const gaps = circles.map(c => ({label:c.label, gap: c.ideal - c.current}))
    .sort((a,b) => b.gap - a.gap);
  const biggestGap = gaps[0];

  if(biggestGap.gap >= 20){
    paragraphs.push('Your biggest gap between where this team is and where you believe it should be is in <strong style="color:#e8d7a0">'+biggestGap.label+'</strong>. That is worth bringing into the room when the team looks at this together.');
  } else if(biggestGap.gap <= 5 && Math.max(...circles.map(c=>c.current)) >= 70){
    paragraphs.push('You don\'t see a major gap between where this team is and where it should be &mdash; which suggests real contentment with the current culture, not just low expectations.');
  }

  // 3. Lowest current score
  const lowest = [...circles].sort((a,b) => a.current - b.current)[0];
  if(lowest.current < 55){
    paragraphs.push('<strong style="color:#e8d7a0">'+lowest.label+'</strong> is currently your lowest-scoring area for this team. That doesn\'t mean something is broken &mdash; but it is the area most worth exploring together.');
  }

  return paragraphs;
}

function renderResults(scores){
  const rel=scores.relationships, val=scores.values, cal=scores.calling;

  function tierLabel(pct){ return pct>=80?"Thriving":pct>=60?"Healthy":pct>=40?"Developing":pct>=20?"Struggling":"Critical"; }
  function barColor(pct){ return pct>=80?"#C4A055":pct>=60?"#B8AA7A":pct>=40?"#8AACCB":pct>=20?"#5B8DB0":"#3A6D94"; }
  function agreePhrase(pct){
    if(pct>=80) return "with most of your answers strongly agreeing";
    if(pct>=60) return "with your answers leaning toward agreement";
    if(pct>=40) return "with your answers closer to the middle";
    if(pct>=20) return "with most of your answers leaning toward disagreement";
    return "with most of your answers strongly disagreeing";
  }

  const circleDescs = {
    "Relationships": "How well this team knows, trusts, and actually enjoys each other — not just works together.",
    "Values": "Whether this team's convictions are real and lived, or just stated on paper.",
    "Calling": "Whether people on this team are known for their gifting, well-placed to use it, and growing because of it."
  };

  // Find biggest gap circle for greatest desire tag
  const allGaps = [
    {id:"Relationships", gap: rel.ideal - rel.current},
    {id:"Values", gap: val.ideal - val.current},
    {id:"Calling", gap: cal.ideal - cal.current}
  ];
  const biggestGapCircle = [...allGaps].sort((a,b)=>b.gap-a.gap)[0].id;

  // Find biggest give/receive imbalance
  const giveReceiveGaps = [
    {label:"Relationships", give:rel.selfCurrent, receive:rel.outwardCurrent, gap:rel.selfCurrent - rel.outwardCurrent},
    {label:"Values", give:val.selfCurrent, receive:val.outwardCurrent, gap:val.selfCurrent - val.outwardCurrent},
    {label:"Calling", give:cal.selfCurrent, receive:cal.outwardCurrent, gap:cal.selfCurrent - cal.outwardCurrent}
  ];
  const bigImbalance = [...giveReceiveGaps].sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap))[0];

  function reflectionCard(eyebrow, paras){
    let html = "<div style=\"background:#1a1714;border:1px solid rgba(196,168,130,.25);border-left:4px solid #c4a882;border-radius:4px;padding:2rem;margin-top:1.5rem\">";
    html += "<div style=\"font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.85rem;font-weight:500\">" + eyebrow + "</div>";
    paras.forEach(p=>{ html += "<p style=\"font-size:.92rem;color:#c0b8b0;line-height:1.9;margin-bottom:.85rem\">" + p + "</p>"; });
    html += "</div>";
    return html;
  }

  function barPair(label, curPct, idealPct){
    const curCol = barColor(curPct);
    const idealCol = barColor(idealPct);
    const desc = circleDescs[label] || "";
    return "<div style=\"background:#1a1816;border:1px solid rgba(232,215,160,.1);border-radius:4px;padding:1.25rem 1.5rem;margin-bottom:.75rem\">"
      + "<div style=\"margin-bottom:.85rem\">"
      + "<div style=\"font-size:.88rem;font-weight:500;color:#f0e8df;letter-spacing:.04em;margin-bottom:.35rem\">" + label + "</div>"
      + "<div style=\"font-size:.8rem;color:#6a6258;line-height:1.6\">" + desc + "</div>"
      + "</div>"
      + "<div style=\"display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem\">"
      + "<div style=\"width:90px;flex-shrink:0;font-size:.68rem;color:#6a6258\">Current</div>"
      + "<div style=\"flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden\">"
      + "<div style=\"width:" + curPct + "%;height:100%;background:" + curCol + ";border-radius:3px;transition:width .8s ease\"></div>"
      + "</div>"
      + "<div style=\"width:70px;text-align:right;font-size:.68rem;font-weight:500;color:" + curCol + "\">" + tierLabel(curPct) + "</div>"
      + "</div>"
      + "<div style=\"display:flex;align-items:center;gap:.75rem\">"
      + "<div style=\"width:90px;flex-shrink:0;font-size:.68rem;color:#6a6258\">Ideal</div>"
      + "<div style=\"flex:1;height:10px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden\">"
      + "<div style=\"width:" + idealPct + "%;height:100%;background:" + idealCol + ";border-radius:3px;opacity:.45;transition:width .8s ease\"></div>"
      + "</div>"
      + "<div style=\"width:70px;text-align:right;font-size:.68rem;font-weight:500;color:" + idealCol + ";opacity:.7\">" + tierLabel(idealPct) + "</div>"
      + "</div>"
      + (label === biggestGapCircle && (idealPct - curPct) >= 15
          ? "<div style=\"margin-top:.75rem;font-size:.72rem;color:#c4a882;font-style:italic;display:flex;align-items:center;gap:6px\"><span>&#9733;</span> Your greatest desire for change on this team.</div>"
          : "")
      + "</div>";
  }

  const initiateLabels = {
    "Relationships": {mine:"I initiate with team", theirs:"The team initiates with me"},
    "Values": {mine:"I initiate with the team", theirs:"The team initiated with me"},
    "Calling": {mine:"I initiate with the team", theirs:"The team initiated with me"}
  };

  function initiateRow(label, outCur, outIdeal, selfCur, selfIdeal){
    const labels = initiateLabels[label];
    const selfCurCol = barColor(selfCur||0);
    const selfIdealCol = barColor(selfIdeal||0);
    const outCurCol = barColor(outCur||0);
    const outIdealCol = barColor(outIdeal||0);
    return "<div style=\"padding:.9rem .9rem .75rem;border-bottom:1px solid rgba(232,215,160,.06)\">"
      + "<div style=\"font-size:.82rem;font-weight:500;color:#f0e8df;margin-bottom:.75rem\">" + label + "</div>"
      + "<div style=\"font-size:.68rem;color:#6a6258;margin-bottom:.35rem\">" + labels.mine + "</div>"
      + "<div style=\"display:flex;align-items:center;gap:.6rem;margin-bottom:.3rem\">"
      + "<div style=\"width:44px;flex-shrink:0;font-size:.62rem;color:#5a5550\">Current</div>"
      + "<div style=\"flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden\">"
      + "<div style=\"width:" + (selfCur||0) + "%;height:100%;background:" + selfCurCol + ";border-radius:3px;transition:width .8s ease\"></div>"
      + "</div></div>"
      + "<div style=\"display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem\">"
      + "<div style=\"width:44px;flex-shrink:0;font-size:.62rem;color:#5a5550\">Ideal</div>"
      + "<div style=\"flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden\">"
      + "<div style=\"width:" + (selfIdeal||0) + "%;height:100%;background:" + selfIdealCol + ";border-radius:3px;opacity:.5;transition:width .8s ease\"></div>"
      + "</div></div>"
      + "<div style=\"font-size:.68rem;color:#6a6258;margin-bottom:.35rem\">" + labels.theirs + "</div>"
      + "<div style=\"display:flex;align-items:center;gap:.6rem;margin-bottom:.3rem\">"
      + "<div style=\"width:44px;flex-shrink:0;font-size:.62rem;color:#5a5550\">Current</div>"
      + "<div style=\"flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden\">"
      + "<div style=\"width:" + (outCur||0) + "%;height:100%;background:" + outCurCol + ";border-radius:3px;transition:width .8s ease\"></div>"
      + "</div></div>"
      + "<div style=\"display:flex;align-items:center;gap:.6rem\">"
      + "<div style=\"width:44px;flex-shrink:0;font-size:.62rem;color:#5a5550\">Ideal</div>"
      + "<div style=\"flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden\">"
      + "<div style=\"width:" + (outIdeal||0) + "%;height:100%;background:" + outIdealCol + ";border-radius:3px;opacity:.5;transition:width .8s ease\"></div>"
      + "</div></div>"
      + "</div>";
  }

  // ── Things to Consider (dynamic writeup) ──────────────────
  const circles = [
    {label:"Relationships", current:rel.current, ideal:rel.ideal},
    {label:"Values", current:val.current, ideal:val.ideal},
    {label:"Calling", current:cal.current, ideal:cal.ideal}
  ];
  const strongest = [...circles].sort((a,b)=>b.current-a.current)[0];
  const biggestGap = [...circles].sort((a,b)=>(b.ideal-b.current)-(a.ideal-a.current))[0];

  const thingsParas = [];
  if(biggestGap.label !== strongest.label && (biggestGap.ideal - biggestGap.current) >= 15){
    thingsParas.push("Based on how you answered, <strong style=\"color:#f0e8df\">" + strongest.label + "</strong> feels like your strongest area right now. The biggest disconnect between where you see the team today and where you believe it should be shows up in <strong style=\"color:#f0e8df\">" + biggestGap.label + "</strong>. Both are worth naming with your team.");
  } else {
    thingsParas.push("Based on how you answered, <strong style=\"color:#f0e8df\">" + strongest.label + "</strong> feels like your strongest area right now. That's worth naming with your team.");
  }
  thingsParas.push("<span style=\"font-style:italic;color:#a09890\">Before the group conversation: what is your read on why those areas scored the way they did?</span>");

  // ── Worth Naming (strengths, growth gaps, and imbalance) ───────
  const initiateMineStrength = [
    {label:"Relationships", val:rel.selfCurrent},
    {label:"Values", val:val.selfCurrent},
    {label:"Calling", val:cal.selfCurrent}
  ];
  const myStrongest = [...initiateMineStrength].sort((a,b)=>b.val-a.val)[0];

  const initiateTheirsStrength = [
    {label:"Relationships", val:rel.outwardCurrent},
    {label:"Values", val:val.outwardCurrent},
    {label:"Calling", val:cal.outwardCurrent}
  ];
  const teamStrongest = [...initiateTheirsStrength].sort((a,b)=>b.val-a.val)[0];

  const myGrowthGaps = [
    {label:"Relationships", gap: rel.selfIdeal - rel.selfCurrent},
    {label:"Values", gap: val.selfIdeal - val.selfCurrent},
    {label:"Calling", gap: cal.selfIdeal - cal.selfCurrent}
  ];
  const myBiggestGrowthGap = [...myGrowthGaps].sort((a,b)=>b.gap-a.gap)[0];

  const teamGrowthGaps = [
    {label:"Relationships", gap: rel.outwardIdeal - rel.outwardCurrent},
    {label:"Values", gap: val.outwardIdeal - val.outwardCurrent},
    {label:"Calling", gap: cal.outwardIdeal - cal.outwardCurrent}
  ];
  const teamBiggestGrowthGap = [...teamGrowthGaps].sort((a,b)=>b.gap-a.gap)[0];

  const IMBALANCE_THRESHOLD = 10;

  const worthNamingParas = [];
  worthNamingParas.push("Based on your answers, your biggest strength seems to be <strong style=\"color:#f0e8df\">" + myStrongest.label + "</strong> — you feel you initiate with this team a great deal there.");
  worthNamingParas.push("Your answers also suggest the team's biggest strength is <strong style=\"color:#f0e8df\">" + teamStrongest.label + "</strong>, where you feel they've initiated with you the most.");
  if(myBiggestGrowthGap.gap >= IMBALANCE_THRESHOLD){
    worthNamingParas.push("Your biggest personal growth gap, based on how you responded, is in <strong style=\"color:#f0e8df\">" + myBiggestGrowthGap.label + "</strong> — there's a real distance between how much you feel you currently initiate there and how much you believe you should.");
  }
  if(teamBiggestGrowthGap.gap >= IMBALANCE_THRESHOLD){
    worthNamingParas.push("You also indicated the team's biggest growth gap is in <strong style=\"color:#f0e8df\">" + teamBiggestGrowthGap.label + "</strong> — a real distance between how much you feel they currently initiate with you there and how much you believe they should.");
  }
  if(Math.abs(bigImbalance.gap) >= IMBALANCE_THRESHOLD){
    const dir = bigImbalance.gap > 0
      ? "you are initiating with the team more than they are initiating with you"
      : "the team is initiating with you more than you are initiating with them";
    worthNamingParas.push("As for imbalance, your answers point to <strong style=\"color:#f0e8df\">" + bigImbalance.label + "</strong> as the widest gap between what you feel you put in and what you feel you get back — it seems " + dir + ". That's worth naming before the group conversation.");
  }


  // ── Build HTML ────────────────────────────────────────────
  let html = "<div class=\"main\"><div class=\"results-page\">";
  html += "<div style=\"padding:1.5rem 0 1rem;border-bottom:1px solid rgba(232,215,160,.1);margin-bottom:1.5rem\"><p style=\"font-size:.95rem;color:#a09890;font-family:Cormorant Garamond,serif;font-style:italic;margin:0\">Thank you, " + userName + ". Here is how you see " + teamName + " at this point in time.</p></div>";
  html += "<div style=\"text-align:center;padding:2rem 0;border-bottom:1px solid rgba(232,215,160,.1);margin-bottom:2rem\"><h2>Your View of " + teamName + "</h2><p style=\"color:#6a6258;font-size:.85rem;max-width:none\">This is your perspective only. Once the full team has responded, Steve will bring all perspectives together.</p></div>";

  // Section 1 — How You See the Team
  html += "<div class=\"section-label\">How You See the Team Right Now</div>";
  html += barPair("Relationships", rel.current, rel.ideal);
  html += barPair("Values", val.current, val.ideal);
  html += barPair("Calling", cal.current, cal.ideal);

  // Section 2 — Things to Consider
  html += reflectionCard("Things to Consider", thingsParas);

  // Section 3 — Your Relationship With This Team
  html += "<div class=\"section-label\" style=\"margin-top:2.5rem\">Your Relationship With This Team</div>";
  html += "<p style=\"font-size:.85rem;color:#6a6258;line-height:1.7;margin-bottom:1rem\">Both sides matter — what you initiate toward this team, and what this team initiates toward you.</p>";
  html += "<div style=\"background:#1a1816;border:1px solid rgba(232,215,160,.1);border-radius:4px;padding:.5rem 0;margin-bottom:.75rem\">";
  html += initiateRow("Relationships", rel.outwardCurrent, rel.outwardIdeal, rel.selfCurrent, rel.selfIdeal);
  html += initiateRow("Values", val.outwardCurrent, val.outwardIdeal, val.selfCurrent, val.selfIdeal);
  html += initiateRow("Calling", cal.outwardCurrent, cal.outwardIdeal, cal.selfCurrent, cal.selfIdeal);
  html += "</div>";
  html += reflectionCard("Worth Naming", worthNamingParas);

  // Section 4 — Before the Debrief + CTA
  html += "<div style=\"margin-top:3rem;padding:2.5rem;background:#1a1714;border:1px solid rgba(232,215,160,.15);border-radius:4px\">";
  html += "<h3 style=\"margin-bottom:.5rem\">Before the Debrief</h3>";
  html += "<p style=\"font-size:.88rem;color:#6a6258;line-height:1.7;margin-bottom:1.75rem\">Take a few minutes to sit with these questions before the group conversation. Your honest reflection will make the debrief richer for everyone.</p>";
  html += "<div style=\"display:flex;flex-direction:column;gap:1.25rem;margin-bottom:2rem\">";
  html += "<div style=\"padding:1.25rem 1.5rem;background:#111111;border:1px solid rgba(232,215,160,.08);border-radius:4px\">"
    + "<div style=\"font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#D85A30;margin-bottom:.5rem;font-weight:500\">Relationships</div>"
    + "<p style=\"font-size:.88rem;color:#c0b8b0;line-height:1.7;margin:0\">Who on this team do you know least well? What would it take to change that?</p>"
    + "</div>";
  html += "<div style=\"padding:1.25rem 1.5rem;background:#111111;border:1px solid rgba(232,215,160,.08);border-radius:4px\">"
    + "<div style=\"font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#185FA5;margin-bottom:.5rem;font-weight:500\">Values</div>"
    + "<p style=\"font-size:.88rem;color:#c0b8b0;line-height:1.7;margin:0\">Is there a conviction you have seen this team compromise on recently? What kept you from naming it?</p>"
    + "</div>";
  html += "<div style=\"padding:1.25rem 1.5rem;background:#111111;border:1px solid rgba(232,215,160,.08);border-radius:4px\">"
    + "<div style=\"font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#534AB7;margin-bottom:.5rem;font-weight:500\">Calling</div>"
    + "<p style=\"font-size:.88rem;color:#c0b8b0;line-height:1.7;margin:0\">Are you being used according to your actual gifting on this team — and if not, what would it take to change that?</p>"
    + "</div>";
  html += "</div>";
  html += "<div style=\"border-top:1px solid rgba(232,215,160,.1);padding-top:2rem;text-align:center\">";
  html += "<h3 style=\"margin-bottom:.75rem\">Ready to bring the team together?</h3>";
  html += "<p style=\"color:#6a6258;font-size:.88rem;margin-bottom:1.5rem\">Once everyone has completed this assessment, Steve will compile all perspectives into a Team Culture Report and facilitate a 90-minute debrief.</p>";
  html += "<a href=\"mailto:admin@boldhearts.org?subject=Leadership Team Culture - Assessment Complete\" style=\"display:inline-block;background:#e8d7a0;color:#111;padding:.85rem 2rem;border-radius:4px;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500\">Schedule a Debrief &rarr;</a>";
  html += "</div></div>";
  html += "<button class=\"retake-btn\" onclick=\"retake()\">&#8592; Retake Assessment</button>";
  html += "</div></div>";
  document.getElementById("app").innerHTML = html;
}


function retake(){
  answers={};userName='';userEmail='';teamName='';
  document.getElementById('progress-section').style.display='none';
  renderIntroGate();
  window.scrollTo({top:0,behavior:'smooth'});
}

function checkTestMode(){
  const params = new URLSearchParams(window.location.search);
  const testParam = params.get('test');
  if(testParam !== 'true' && testParam !== 'write') return false;

  // 'test=true' previews results WITHOUT writing to the sheet
  // 'test=write' fills random answers AND writes to the sheet (for testing the Apps Script connection)
  isTestMode = (testParam === 'true');

  userName = 'Test Leader'; userEmail = 'test@example.com'; teamName = 'Test Team'; assessmentRound = 'Initial Assessment';
  CIRCLES.forEach(c=>{
    ['outward','self'].forEach(grp=>{
      c[grp].forEach((_,i)=>{
        answers[c.id+'_'+grp+'_'+i+'_cur'] = Math.round((2 + Math.random()*4)*100)/100;
        answers[c.id+'_'+grp+'_'+i+'_ideal'] = Math.round((5 + Math.random()*2)*100)/100;
      });
    });
  });
  return true;
}

if(checkTestMode()){
  finalizeSubmission();
} else {
  renderIntroGate();
}
</script>
