
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoldHearts Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:11pt}
body{font-family:'Inter',sans-serif;font-weight:300;line-height:1.8;color:#2a2218;background:#fff;max-width:720px;margin:0 auto;padding:2.5rem 2rem 4rem}

/* Header */
.doc-header{text-align:center;padding-bottom:2rem;margin-bottom:2rem;border-bottom:2px solid #c4a882}
.bh-logo{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4a3a2a;margin-bottom:.3rem}
.bh-logo span{color:#c4a882}
.doc-eyebrow{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#c4a882;margin-bottom:1.25rem}
.doc-title{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:700;color:#1a1410;line-height:1.2;margin-bottom:.5rem}
.doc-subtitle{font-size:.95rem;color:#6a5a4a;font-style:italic;margin-bottom:1.25rem}
.doc-meta{display:flex;justify-content:center;gap:2rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#9a8a7a}

/* Purpose block */
.purpose-block{background:#faf6f0;border:1px solid #e8d8c0;border-left:4px solid #c4a882;border-radius:4px;padding:1.75rem 2rem;margin-bottom:2rem}
.purpose-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.75rem;font-weight:500}
.purpose-block p{font-size:.88rem;color:#4a3a2a;line-height:1.9;margin-bottom:.75rem;font-style:italic;max-width:none}
.purpose-block p:last-child{margin-bottom:0}

/* Score summary */
.scores-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:2rem}
.score-block{background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:1rem;text-align:center}
.score-block-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#9a8a7a;margin-bottom:.4rem}
.score-block-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700}
.score-high{color:#5a9a50}
.score-mid{color:#c4a882}
.score-low{color:#c97a5a}

/* Sections */
.section{margin-bottom:1.75rem;break-inside:avoid}
.section-eyebrow{display:flex;align-items:center;gap:.5rem;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.6rem}
.section-icon{font-size:.9rem;line-height:1}
.section-body{font-size:.88rem;color:#2a2218;line-height:1.95}
.section-body p{margin-bottom:.9rem;max-width:none}
.section-body p:last-child{margin-bottom:0}

/* Practice cards */
.practice{background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:1.25rem 1.5rem;margin-bottom:.75rem;break-inside:avoid}
.practice-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;color:#1a1410;margin-bottom:.4rem}
.practice-body{font-size:.85rem;color:#4a3a2a;line-height:1.9}
.practice-why{font-size:.82rem;color:#7a6a5a;margin-top:.5rem;font-style:italic;line-height:1.8}

/* Divider */
.section-divider{border:none;border-top:1px solid #e8d8c0;margin:1.75rem 0}

/* Closing */
.closing-block{background:#1a1410;border-radius:4px;padding:1.75rem 2rem;margin-top:2rem;break-inside:avoid}
.closing-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.6rem}
.closing-text{font-size:.88rem;color:#c8b8a8;line-height:1.95;font-style:italic}

/* CTA */
.cta-block{border:1px solid #e8d8c0;border-top:3px solid #c4a882;border-radius:4px;padding:1.5rem 2rem;text-align:center;margin-top:1.75rem;break-inside:avoid}
.cta-block p{font-size:.85rem;color:#4a3a2a;line-height:1.8;margin-bottom:.5rem;max-width:none}
.cta-block a{color:#c4a882;font-weight:500}

/* Footer */
.doc-footer{text-align:center;margin-top:3rem;padding-top:1.5rem;border-top:1px solid #e8d8c0}
.doc-footer p{font-size:.72rem;color:#9a8a7a;letter-spacing:.04em}

/* Loading state */
.loading{text-align:center;padding:6rem 2rem;color:#9a8a7a;font-size:.9rem}
.loading-dots{display:inline-flex;gap:6px;margin-top:1rem}
.loading-dot{width:7px;height:7px;border-radius:50%;background:#c4a882;animation:pulse 1.2s infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* Error */
.error{text-align:center;padding:4rem 2rem;color:#c97a5a;font-size:.9rem}

/* Print */
@media print{
  body{padding:1rem;max-width:none}
  .no-print{display:none}
  .section{break-inside:avoid}
  .practice{break-inside:avoid}
  .cta-block{break-inside:avoid}
}
@page{margin:1.5cm 2cm}
</style>
</head>
<body>

<div id="content">
  <div class="loading">
    <div>Building your guide...</div>
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = 'https://snowy-queen-d35d.forney-steve.workers.dev';
const PURPOSE_TEXT = [
  "Before you read what follows, take a moment to understand what you're actually looking at.",
  "Your heart is not a metaphor. It is the organizing center of your interior life — the place where what you believe, what you fear, what you long for, and what you've never quite named all live together. The Interior Health Assessment is asking about the condition of that center. Not your behavior, not your output, not how you present. The actual interior — what is alive in there, what has gone quiet, what weights are carried and where there is freedom.",
  "The heart was made to move blood — and blood was made to carry life. The Relational Health Assessment is measuring the relationships you move in and out of like blood through the heart — the people, communities, and contexts that either carry life into you or draw it out. When the interior is tended — when grief has been named, when shame has lost its grip, when desire is still alive — that life moves freely. It leads to deeper community, richer engagement with God, and the kind of trust that makes real relationship possible.",
  "But the interior world where things are never shared — where the hard things stay unnamed and the weight gets managed rather than moved through — keeps the heart from moving forward in relationship. Not all at once. Slowly. Quietly. Until the distance between who you are inside and who you appear to be becomes its own kind of isolation.",
  "The two assessments you have just taken are pictures of the same heart — the interior realm and the relational. What follows is a culmination of those assessments, combined with years of counseling and heart work, brought together in a guide to help in healing and restoration."
];

function scoreColor(val) {
  if(!val) return 'score-mid';
  const s = val.toString().replace('%','');
  const n = parseFloat(s);
  if(isNaN(n)) return 'score-mid';
  const pct = n <= 1 ? n * 100 : n;
  if(pct >= 70) return 'score-high';
  if(pct >= 45) return 'score-mid';
  return 'score-low';
}

function fmtScore(val) {
  if(!val) return '—';
  const s = val.toString().trim();
  if(s.endsWith('%')) return s;
  const n = parseFloat(s);
  if(isNaN(n)) return s;
  if(n > 0 && n <= 1) return Math.round(n * 100) + '%';
  return Math.round(n) + '%';
}

function renderGuide(data) {
  const { name, guide, a1, hs, date } = data;
  const today = date || new Date().toLocaleDateString('en-US', {month:'long', year:'numeric'});

  const purposeHtml = PURPOSE_TEXT.map(p => '<p>' + p + '</p>').join('');

  // Score summary
  const a1Score = fmtScore(a1?.overall);
  const hsScore = fmtScore(hs?.overall);
  const godScore = fmtScore(a1?.god);
  const scoresHtml = '<div class="scores-grid">'
    + '<div class="score-block"><div class="score-block-label">Relational Health</div><div class="score-block-val ' + scoreColor(a1Score) + '">' + a1Score + '</div></div>'
    + '<div class="score-block"><div class="score-block-label">Interior Health</div><div class="score-block-val ' + scoreColor(hsScore) + '">' + hsScore + '</div></div>'
    + '<div class="score-block"><div class="score-block-label">With God</div><div class="score-block-val ' + scoreColor(godScore) + '">' + godScore + '</div></div>'
    + '</div>';

  // Sections
  const sectionsHtml = (guide.sections || []).map(s => {
    if(s.id === 'practices') {
      // Render each practice as a card — split on double newline or numbered list
      const practiceBlocks = s.content.split(/\n\n+/).filter(p => p.trim()).map(p => {
        const lines = p.trim().split('\n');
        const title = lines[0].replace(/^\*\*|\*\*$/g,'').replace(/^#+\s*/,'');
        const body = lines.slice(1).join(' ').trim();
        // Split why from body if "Why it fits" pattern exists
        const whyMatch = body.match(/^(.*?)(Why it fits[^:]*:|Because[^:]*:)(.*)$/si);
        if(whyMatch) {
          return '<div class="practice"><div class="practice-name">' + title + '</div>'
            + '<div class="practice-body">' + whyMatch[1].trim() + '</div>'
            + '<div class="practice-why">' + whyMatch[2] + whyMatch[3].trim() + '</div></div>';
        }
        return '<div class="practice"><div class="practice-name">' + title + '</div>'
          + '<div class="practice-body">' + body + '</div></div>';
      }).join('');
      return '<div class="section">'
        + '<div class="section-eyebrow"><span class="section-icon">' + s.icon + '</span>' + s.label + '</div>'
        + practiceBlocks + '</div>';
    }
    const paragraphs = s.content.split(/\n\n+/).filter(p=>p.trim()).map(p=>'<p>'+p.trim()+'</p>').join('');
    return '<div class="section">'
      + '<div class="section-eyebrow"><span class="section-icon">' + s.icon + '</span>' + s.label + '</div>'
      + '<div class="section-body">' + paragraphs + '</div></div>';
  }).join('<hr class="section-divider">');

  document.getElementById('content').innerHTML =
    '<div class="doc-header">'
    + '<div class="bh-logo">Bold<span>Hearts</span></div>'
    + '<div class="doc-eyebrow">Spiritual Direction Guide</div>'
    + '<div class="doc-title">' + (guide.title || name + "'s Guide") + '</div>'
    + (guide.subtitle ? '<div class="doc-subtitle">' + guide.subtitle + '</div>' : '')
    + '<div class="doc-meta"><span>Prepared for: ' + name + '</span><span>' + today + '</span><span>Steve Forney · BoldHearts</span></div>'
    + '</div>'

    + '<div class="purpose-block"><div class="purpose-label">Purpose of the Assessments</div>' + purposeHtml + '</div>'

    + scoresHtml

    + sectionsHtml

    + (guide.closingNote ? '<div class="closing-block"><div class="closing-label">A Note from Steve</div><div class="closing-text">' + guide.closingNote + '</div></div>' : '')

    + '<div class="cta-block">'
    + '<p><strong>Ready to look at the full picture together?</strong></p>'
    + '<p>Schedule a free 15-minute Discovery Call. Bring both assessments and we\'ll walk through what the scores reveal — and what comes next.</p>'
    + '<p><a href="mailto:admin@boldhearts.org?subject=Discovery Call">admin@boldhearts.org</a> &nbsp;·&nbsp; boldhearts.org</p>'
    + '</div>'

    + '<div class="doc-footer"><p>&copy; 2026 BoldHearts &nbsp;·&nbsp; Sedalia, Colorado &nbsp;·&nbsp; Spiritual Direction · Pastoral Counseling · Leadership Soul Care</p></div>';

  // Auto-trigger print after a short delay for fonts to load
  setTimeout(() => window.print(), 800);
}

function showError(msg) {
  document.getElementById('content').innerHTML = '<div class="error"><p>' + msg + '</p></div>';
}

// Read data passed via sessionStorage from admin
window.addEventListener('load', async () => {
  try {
    const raw = sessionStorage.getItem('boldhearts_guide_data');
    if(!raw) { showError('No guide data found. Please use the Build Guide button in the admin dashboard.'); return; }
    const data = JSON.parse(raw);

    // If guide is already generated (cached), render immediately
    if(data.guide && data.guide.sections && data.guide.sections.length > 0) {
      renderGuide(data);
      return;
    }

    // Otherwise call the worker to generate
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: data.name,
        email: data.email,
        assessment1: data.a1,
        heartsoul: data.hs
      })
    });

    const result = await res.json();
    if(result.error) { showError('Guide generation failed: ' + result.error); return; }

    data.guide = result.guide;
    renderGuide(data);

  } catch(e) {
    showError('Something went wrong: ' + e.message);
  }
});
</script>
</body>
</html>
