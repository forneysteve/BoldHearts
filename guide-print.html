
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoldHearts Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:11pt}
body{font-family:'Inter',sans-serif;font-weight:300;line-height:1.8;color:#2a2218;background:#f5f0e8;margin:0;padding:2rem 1rem 4rem}
.guide-wrap{background:#fff;max-width:780px;margin:0 auto;padding:3rem 3.5rem 4rem;box-shadow:0 2px 40px rgba(0,0,0,0.08);border-radius:4px}

/* ── HEADER ── */
.doc-header{text-align:center;padding-bottom:2rem;margin-bottom:2rem;border-bottom:2px solid #c4a882}
.bh-logo{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#4a3a2a;margin-bottom:.3rem}
.bh-logo span{color:#c4a882}
.doc-eyebrow{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#c4a882;margin-bottom:1.25rem}
.doc-title{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:700;color:#1a1410;line-height:1.2;margin-bottom:.5rem}
.doc-subtitle{font-size:.95rem;color:#6a5a4a;font-style:italic;margin-bottom:1.25rem}
.doc-meta{display:flex;justify-content:center;gap:2rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#9a8a7a}

/* ── PURPOSE BLOCK ── */
.purpose-block{background:#faf6f0;border:1px solid #e8d8c0;border-left:4px solid #c4a882;border-radius:4px;padding:1.75rem 2rem;margin-bottom:0}
.purpose-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.75rem;font-weight:500}
.purpose-block p{font-size:.88rem;color:#4a3a2a;line-height:1.9;margin-bottom:.75rem;font-style:italic;max-width:none}
.purpose-block p:last-child{margin-bottom:0}

/* ── PAGE BREAK after intro ── */
.page-break{page-break-after:always;break-after:page;height:0;display:block}

/* ── SECTION HEADERS (big) ── */
.section-header{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:#1a1410;margin:2rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid #e8d8c0;break-after:avoid}

/* ── SCORE SUMMARY ── */
.scores-wrap{margin-bottom:2rem;break-inside:avoid}
.scores-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.score-block{background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:1rem;text-align:center;break-inside:avoid}
.score-block-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#9a8a7a;margin-bottom:.4rem}
.score-block-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700}
.score-high{color:#5a9a50}
.score-mid{color:#c4a882}
.score-low{color:#c97a5a}

/* ── SECTIONS ── */
.section{margin-bottom:1.75rem;break-inside:avoid}
.section-eyebrow{display:flex;align-items:center;gap:.5rem;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.6rem;font-weight:500}
.section-icon{font-size:1rem;line-height:1}
.section-body{font-size:.88rem;color:#2a2218;line-height:1.95}
.section-body p{margin-bottom:.9rem;max-width:none}
.section-body p:last-child{margin-bottom:0}
.section-body p:first-of-type{font-size:.98rem;line-height:2;color:#1a1410}
.section-body p:first-of-type::first-letter{float:left;font-family:'Cormorant Garamond',serif;font-size:3.8rem;font-weight:700;line-height:.75;margin:.05em .1em 0 0;color:#c4a882}

/* ── PRACTICE CARDS ── */
.practices-wrap{break-inside:avoid}
.practice{background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:1.25rem 1.5rem;margin-bottom:.75rem;break-inside:avoid}
.practice:last-child{margin-bottom:0}
.practice-name{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:700;color:#1a1410;margin-bottom:.4rem}
.practice-body{font-size:.85rem;color:#4a3a2a;line-height:1.9}
.practice-why{font-size:.82rem;color:#7a6a5a;margin-top:.6rem;font-style:italic;line-height:1.8;border-top:1px solid #e8d8c0;padding-top:.5rem}
.practice-instruction{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#c4a882;margin-bottom:.5rem;font-weight:500}
.practices-tier-header{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin:1.5rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid #e8d8c0;font-weight:500}
.secondary-practice{background:#fff;border:1px solid #e8d8c0;border-radius:4px;padding:.9rem 1.25rem;margin-bottom:.5rem;break-inside:avoid}
.secondary-practice-name{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:700;color:#1a1410;margin-bottom:.2rem}
.secondary-practice-body{font-size:.82rem;color:#4a3a2a;line-height:1.8}
.aware-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.25rem}
.aware-item{background:#faf6f0;border:1px solid #e8d8c0;border-radius:3px;padding:.65rem .9rem;break-inside:avoid}
.aware-item-name{font-size:.78rem;font-weight:500;color:#1a1410;margin-bottom:.2rem}
.aware-item-desc{font-size:.72rem;color:#7a6a5a;line-height:1.6}

/* ── DIVIDER ── */
.section-divider{border:none;border-top:1px solid #e8d8c0;margin:1.75rem 0;break-after:avoid}

/* ── CLOSING ── */
.closing-block{background:#1a1410;border-radius:4px;padding:1.75rem 2rem;margin-top:2rem;break-inside:avoid}
.closing-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c4a882;margin-bottom:.6rem}
.closing-text{font-size:.88rem;color:#c8b8a8;line-height:1.95;font-style:italic}

/* ── CTA ── */
.cta-block{border:1px solid #e8d8c0;border-top:3px solid #c4a882;border-radius:4px;padding:1.5rem 2rem;text-align:center;margin-top:1.75rem;break-inside:avoid}
.cta-block p{font-size:.85rem;color:#4a3a2a;line-height:1.8;margin-bottom:.5rem;max-width:none}
.cta-block a{color:#c4a882;font-weight:500}

/* ── FOOTER ── */
.doc-footer{text-align:center;margin-top:3rem;padding-top:1.5rem;border-top:1px solid #e8d8c0;break-inside:avoid}
.doc-footer p{font-size:.68rem;color:#9a8a7a;letter-spacing:.03em;max-width:none;line-height:1.6}

/* ── LOADING / ERROR ── */
.loading{text-align:center;padding:6rem 2rem;color:#9a8a7a;font-size:.9rem}
.loading-dots{display:inline-flex;gap:6px;margin-top:1rem}
.loading-dot{width:7px;height:7px;border-radius:50%;background:#c4a882;animation:pulse 1.2s infinite}
.loading-dot:nth-child(2){animation-delay:.2s}
.loading-dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.error{text-align:center;padding:4rem 2rem;color:#c97a5a;font-size:.9rem}

/* ── PRINT ── */
/* Charts */
.dashboard-wrap{margin-bottom:2rem;break-inside:avoid}
.dash-scores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:1.5rem}
.dash-score{background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:1rem;text-align:center;break-inside:avoid}
.dash-score-label{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#9a8a7a;margin-bottom:.3rem}
.dash-score-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700}
.dash-score-tag{font-size:.7rem;color:#9a8a7a;margin-top:2px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.chart-card{background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:1rem;break-inside:avoid}
.chart-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#c4a882;margin-bottom:.75rem;font-weight:500;padding-bottom:.4rem;border-bottom:1px solid #e8d8c0}
.chart-wrap{position:relative}

.pull-quote-left{float:left;width:42%;margin:0 1.5rem 1rem -1rem;padding:1.25rem 1.5rem;border-top:2px solid #c4a882;border-bottom:2px solid #c4a882;background:#faf6f0;break-inside:avoid}
.pull-quote-right{float:right;width:42%;margin:0 -1rem 1rem 1.5rem;padding:1.25rem 1.5rem;border-top:2px solid #c4a882;border-bottom:2px solid #c4a882;background:#faf6f0;break-inside:avoid}
.pull-quote-left p,.pull-quote-right p{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:#2a2218;line-height:1.65;margin:0 0 .5rem}
.pull-quote-left cite,.pull-quote-right cite{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#c4a882;font-style:normal}
@media(max-width:600px){.pull-quote-left,.pull-quote-right{float:none;width:100%;margin:1rem 0}}
.print-btn{position:fixed;bottom:2rem;right:2rem;background:#c4a882;color:#fff;border:none;border-radius:4px;padding:.85rem 1.5rem;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 12px rgba(196,168,130,.4);transition:all .2s;z-index:100}
.print-btn:hover{background:#b09060;box-shadow:0 4px 20px rgba(196,168,130,.5)}
@media(max-width:600px){
  .guide-wrap{padding:1.5rem 1.25rem;border-radius:0;box-shadow:none}
  body{padding:.5rem 0 4rem;background:#fff}
  .doc-title{font-size:1.8rem}
  .doc-meta{flex-direction:column;gap:.4rem;align-items:center}
  .scores-grid,.charts-grid{grid-template-columns:1fr !important}
  .dash-scores{grid-template-columns:1fr 1fr !important}
  .chart-card{break-inside:avoid}
  .chart-wrap{height:160px !important}
  .aware-grid{grid-template-columns:1fr !important}
  .print-btn{bottom:1rem;right:1rem;padding:.7rem 1.1rem;font-size:.72rem}
  .section-header{font-size:1.3rem}
  .practice{padding:1rem}
  .doc-header{padding-bottom:1.5rem}
}
@media(max-width:400px){
  .dash-scores{grid-template-columns:1fr !important}
  .doc-title{font-size:1.5rem}
}
@media print{
  body{padding:.5rem;max-width:none}
  .no-print{display:none}
  .print-btn{display:none}

  /* Force page break after intro */
  .purpose-block{break-after:page}

  /* Keep together */
  .doc-header{break-inside:avoid}
  .scores-wrap{break-inside:avoid}
  .score-block{break-inside:avoid}
  .section{break-inside:avoid}
  .practice{break-inside:avoid}
  .practices-wrap{break-inside:avoid}
  .closing-block{break-inside:avoid}
  .cta-block{break-inside:avoid}
  .doc-footer{break-inside:avoid}

  /* Section headers stay with their content */
  .section-header{break-after:avoid;break-before:auto}
  .section-eyebrow{break-after:avoid}

  /* Dividers don't break */
  .section-divider{break-after:avoid;break-before:avoid}
}
@page{margin:1.8cm 2cm}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<body>

<button class="print-btn" onclick="window.print()">⬇ Save as PDF</button>
<div class="guide-wrap"><div id="content">
  <div class="loading">
    <div>Building your guide...</div>
    <div class="loading-dots">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = 'https://snowy-queen-d35d.forney-steve.workers.dev';
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzkQHG-plPkD-5g-_8MngVe5P-lcYaxbMvJg0q3-4uUhegipWpr1N-6CWvui8gXH2FgpQ/exec';
const PURPOSE_TEXT = [
  "Thank you for taking the time to complete both assessments. What you've done here is not small — you've given an honest look at the core of who you are.",
  "Much of what defines us can be observed from the outside — what we produce, how we lead, the roles we fill. These assessments aren't interested in any of that. They go deeper. They are an honest look at your heart.",
  "And the heart, like any living thing, has substance. It has muscle and fiber and tissue. It has weight and history and the marks of everything it has been through. The Interior Health Assessment reflects that substance — the hurt and pain you've carried, the joys and desires that have shaped you, the life you've actually lived beneath the surface of what anyone else sees.",
  "But the heart was also made for something. It was made to pump blood — to create movement, to sustain life, to keep everything connected. That is what the Relational Health Assessment measures. Not just who you know, but how life actually moves between you and the people around you. Whether it flows freely or something is restricting it.",
  "These two pictures cannot be separated. The substance of the heart determines the quality of the flow. What you carry inside shapes everything about how you show up with the people in your life. You cannot tend one without tending the other.",
  "What follows is an honest reading of both."
];

function scoreColor(val) {
  if(!val) return 'score-mid';
  const s = val.toString().replace('%','');
  const n = parseFloat(s);
  if(isNaN(n)) return 'score-mid';
  const pct = n <= 1 ? n * 100 : n;
  if(pct >= 70) return 'score-high';
  if(pct >= 45) return 'score-mid';
  return 'score-low';
}

function fmtScore(val) {
  if(!val) return '—';
  const s = val.toString().trim();
  if(s.endsWith('%')) return s;
  const n = parseFloat(s);
  if(isNaN(n)) return s;
  if(n > 0 && n <= 1) return Math.round(n * 100) + '%';
  return Math.round(n) + '%';
}

function renderGuide(data) {
  const { name, guide, a1, hs, date } = data;
  const today = (function() {
    const d = date ? new Date(date) : new Date();
    if(isNaN(d.getTime())) return new Date().toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
    return d.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  })();

  const purposeHtml = PURPOSE_TEXT.map(p => '<p>' + p + '</p>').join('');

  // Score summary with header
  const a1Score = fmtScore(a1?.overall);
  const hsScore = fmtScore(hs?.overall);
  const godScore = fmtScore(a1?.god);

  // Dashboard with charts
  function scoreTag(p) {
    const n = parseFloat(p);
    if(isNaN(n)) return '';
    const v = n <= 1 ? n * 100 : n;
    return v >= 70 ? 'Flowing Freely' : v >= 55 ? 'Meeting Resistance' : v >= 40 ? 'Running Low' : 'Dammed Up';
  }
  function barColor(v) { return v >= 70 ? '#3B6D11' : v >= 45 ? '#BA7517' : '#D85A30'; }
  function makeColors(arr) { return arr.map(barColor); }

  function numVal(s) {
    if(!s) return 0;
    const str = s.toString().replace('%','').trim();
    const n = parseFloat(str);
    if(isNaN(n)) return 0;
    return n <= 1 ? Math.round(n * 100) : Math.round(n);
  }

  console.log('RAW hs:', JSON.stringify(hs));
  console.log('RAW a1:', JSON.stringify(a1));
  const realmVals  = [a1?.work, a1?.partner, a1?.family, a1?.friends, a1?.community, a1?.god].map(numVal);
  const themeVals  = [hs?.grief, hs?.shame, hs?.fear, hs?.anger, hs?.desire, hs?.joy].map(numVal);
  console.log('realmVals:', realmVals);
  console.log('themeVals:', themeVals);
  const relDimVals = [a1?.dim_seen, a1?.dim_known, a1?.dim_voice, a1?.dim_belonging, a1?.dim_support, a1?.dim_trust, a1?.dim_calling, a1?.dim_freedom].map(numVal);
  // Debug: log hs dim values to console
  console.log('hs dims:', {
    awareness: hs?.awareness, honesty: hs?.honesty, movement: hs?.movement,
    safety: hs?.safety, direction: hs?.direction, peace: hs?.peace
  });
  const intDimVals = [hs?.awareness, hs?.honesty, hs?.movement, hs?.safety, hs?.direction, hs?.peace].map(v => {
    if(v === null || v === undefined || v === '' || v === '—') return 0;
    const s = v.toString().trim().replace('%','');
    const n = parseFloat(s);
    if(isNaN(n)) return 0;
    return n <= 1 ? Math.round(n * 100) : Math.round(n);
  });
  console.log('intDimVals:', intDimVals);

  const dashHtml = '<div class="dashboard-wrap">'
    + '<div class="section-header">Your Assessment Scores</div>'
    + '<div class="dash-scores">'
    + '<div class="dash-score"><div class="dash-score-label">Relational Health</div><div class="dash-score-val" style="color:' + barColor(numVal(a1Score)) + '">' + a1Score + '</div><div class="dash-score-tag">' + scoreTag(a1Score) + '</div></div>'
    + '<div class="dash-score"><div class="dash-score-label">Interior Health</div><div class="dash-score-val" style="color:' + barColor(numVal(hsScore)) + '">' + hsScore + '</div><div class="dash-score-tag">' + scoreTag(hsScore) + '</div></div>'
    + '<div class="dash-score"><div class="dash-score-label">With God</div><div class="dash-score-val" style="color:' + barColor(numVal(godScore)) + '">' + godScore + '</div><div class="dash-score-tag">' + scoreTag(godScore) + '</div></div>'
    + '</div>'
    + '<div class="charts-grid">'
    + '<div class="chart-card"><div class="chart-label">Relational — by realm</div><div class="chart-wrap" style="height:180px"><canvas id="realmChart" role="img" aria-label="Relational scores by realm"></canvas></div></div>'
    + '<div class="chart-card"><div class="chart-label">Interior — by theme</div><div class="chart-wrap" style="height:180px"><canvas id="themeChart" role="img" aria-label="Interior scores by theme"></canvas></div></div>'
    + '<div class="chart-card"><div class="chart-label">Relational — dimensions</div><div class="chart-wrap" style="height:220px"><canvas id="relDimChart" role="img" aria-label="Relational dimensions"></canvas></div></div>'
    + '<div class="chart-card"><div class="chart-label">Interior — dimensions</div><div class="chart-wrap" style="height:220px"><canvas id="intDimChart" role="img" aria-label="Interior dimensions"></canvas></div></div>'
    + '</div></div>';

  // ── DETAILED SCORE BREAKDOWN ─────────────────────────────────────────────

  function detailRow(label, val, isLast) {
    const n = numVal(val);
    if(n === 0) return '';
    const col = barColor(n);
    const border = isLast ? '' : 'border-bottom:1px solid #ede8e0;';
    return '<div style="display:flex;align-items:center;gap:.75rem;padding:.35rem 0;'+border+'">'
      +'<div style="width:130px;font-size:.68rem;color:#6a5a4a;flex-shrink:0;text-align:right;line-height:1.3">'+label+'</div>'
      +'<div style="flex:1;height:7px;background:#ede8e0;border-radius:4px;overflow:hidden">'
      +'<div style="width:'+n+'%;height:100%;background:'+col+';border-radius:4px"></div>'
      +'</div>'
      +'<div style="width:34px;font-size:.7rem;font-weight:500;color:'+col+';text-align:right">'+n+'%</div>'
      +'</div>';
  }

  function detailCard(title, rows) {
    if(!rows) return '';
    return '<div style="background:#faf6f0;border:1px solid #e8d8c0;border-radius:4px;padding:.75rem 1rem;break-inside:avoid;margin-bottom:0">'
      +'<div style="font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#c4a882;margin-bottom:.6rem;padding-bottom:.35rem;border-bottom:1px solid #e8d8c0;font-weight:500">'+title+'</div>'
      +rows
      +'</div>';
  }

  // Realm cards
  const realmDefs = [
    {label:'Work / School',     overall:a1?.work,      out:a1?.work_outward,      self:a1?.work_self,      outLabel:'How they engage you',  selfLabel:'How you engage them'},
    {label:'Significant Other', overall:a1?.partner,   out:a1?.partner_outward,   self:a1?.partner_self,   outLabel:'How they engage you',  selfLabel:'How you engage them'},
    {label:'Family',            overall:a1?.family,    out:a1?.family_outward,    self:a1?.family_self,    outLabel:'How they engage you',  selfLabel:'How you engage them'},
    {label:'Friends',           overall:a1?.friends,   out:a1?.friends_outward,   self:a1?.friends_self,   outLabel:'How they engage you',  selfLabel:'How you engage them'},
    {label:'Community',         overall:a1?.community, out:a1?.community_outward, self:a1?.community_self, outLabel:'How they engage you',  selfLabel:'How you engage them'},
    {label:'With God',          overall:a1?.god,       out:a1?.god_outward,       self:a1?.god_self,       outLabel:'How God engages you',  selfLabel:'How you engage God'},
  ].filter(r => numVal(r.overall) > 0);

  const realmCardsHtml = realmDefs.map((r, ridx) => {
    const outN = numVal(r.out), selfN = numVal(r.self);
    const gap = Math.abs(outN - selfN);
    let pattern = '';
    if(outN > 0 && selfN > 0) {
      if(outN < 50 && selfN >= 65) pattern = ' — Giving more than receiving';
      else if(outN >= 65 && selfN < 50) pattern = ' — Others reaching in, holding back';
      else if(outN < 50 && selfN < 50) pattern = ' — Disconnected on both sides';
      else if(outN >= 65 && selfN >= 65 && gap < 15) pattern = ' — Genuine mutuality';
      else if(gap >= 15) pattern = ' — ' + gap + '% gap worth exploring';
      else pattern = ' — Genuine mutuality';
    }
    const card = detailCard(r.label + pattern,
      detailRow('Overall', r.overall, false) +
      detailRow(r.outLabel, r.out, false) +
      detailRow(r.selfLabel, r.self, true)
    );
    return card;
  }).join('');

  // Relational dimensions card
  const relDimItems = [
    {label:'Being Seen',           val:a1?.dim_seen},
    {label:'Being Known',          val:a1?.dim_known},
    {label:'Having a Voice',       val:a1?.dim_voice},
    {label:'Belonging',            val:a1?.dim_belonging},
    {label:'Receiving Support',    val:a1?.dim_support},
    {label:'Trust & Safety',       val:a1?.dim_trust},
    {label:'Calling',              val:a1?.dim_calling},
    {label:'Freedom to Be Myself', val:a1?.dim_freedom},
  ].filter(d => numVal(d.val) > 0);
  const relDimCardHtml = relDimItems.length > 0

function showError(msg) {
  document.getElementById('content').innerHTML = '<div class="error"><p>' + msg + '</p></div>';
}

window.addEventListener('load', async () => {
  try {
    // Check for ?id= in URL first
    const urlParams = new URLSearchParams(window.location.search);
    const guideId = urlParams.get('id');

    if(guideId) {
      // Fetch guide data from Sheets by ID
      document.getElementById('content').innerHTML = '<div class="loading"><div>Loading your guide...</div><div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div></div>';
      const res = await fetch(SHEETS_URL + '?action=getguide&id=' + encodeURIComponent(guideId));
      const text = await res.text();
      try {
        const data = JSON.parse(text);
        if(data.error || !data.guide) { showError('Guide not found. The link may be invalid or expired.'); return; }
        renderGuide(data);
      } catch(e) {
        showError('Could not load guide data.');
      }
      return;
    }

    // Fall back to sessionStorage (admin preview)
    const raw = sessionStorage.getItem('boldhearts_guide_data');
    if(!raw) { showError('No guide data found. Please use the Build Guide button in the admin dashboard.'); return; }
    const data = JSON.parse(raw);

    if(data.guide && data.guide.sections && data.guide.sections.length > 0) {
      renderGuide(data);
      return;
    }

    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: data.name,
        email: data.email,
        assessment1: data.a1,
        heartsoul: data.hs
      })
    });

    const result = await res.json();
    if(result.error) { showError('Guide generation failed: ' + result.error); return; }

    data.guide = result.guide;
    renderGuide(data);

  } catch(e) {
    showError('Something went wrong: ' + e.message);
  }
});
