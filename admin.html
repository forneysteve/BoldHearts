
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoldHearts Admin</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:'Inter',sans-serif;font-weight:300;background:#0d0d0d;color:#d4ccc4;min-height:100vh}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-card{background:#1a1816;border:1px solid rgba(232,215,160,.15);border-radius:6px;padding:3rem;width:100%;max-width:420px;text-align:center}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:#f0e8df;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.25rem}
.login-logo span{color:#e8d7a0}
.login-sub{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#5a5550;margin-bottom:2.5rem}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:1.25rem;text-align:left}
.login-field label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#6a6258}
.login-field input{width:100%;padding:.9rem 1rem;background:#111;border:1px solid rgba(232,215,160,.15);border-radius:4px;color:#d4ccc4;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:300}
.login-field input:focus{outline:none;border-color:#e8d7a0}
.login-btn{width:100%;padding:1rem;background:#e8d7a0;color:#111;border:none;border-radius:4px;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:.5rem}
.login-btn:hover{background:#f5e8c8}
.login-err{font-size:.82rem;color:#c97a5a;margin-top:.75rem;min-height:18px}

/* DASHBOARD */
.dashboard{display:none;min-height:100vh}
.dash-header{background:#111;border-bottom:1px solid rgba(232,215,160,.1);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.dash-logo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:#f0e8df;letter-spacing:.12em;text-transform:uppercase}
.dash-logo span{color:#e8d7a0}
.dash-meta{font-size:.75rem;color:#5a5550;letter-spacing:.06em}
.logout-btn{background:none;border:1px solid rgba(232,215,160,.2);color:#6a6258;font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.4rem 1rem;border-radius:4px;cursor:pointer}
.logout-btn:hover{border-color:#e8d7a0;color:#e8d7a0}
.dash-body{max-width:1200px;margin:0 auto;padding:2rem}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.stat-card{background:#1a1816;border:1px solid rgba(232,215,160,.1);border-radius:4px;padding:1.25rem 1.5rem}
.stat-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-bottom:.5rem}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:#f0e8df}
.stat-sub{font-size:.72rem;color:#6a6258;margin-top:.25rem}

/* SEARCH */
.search-row{display:flex;gap:1rem;margin-bottom:1.25rem;align-items:center}
.search-input{flex:1;padding:.75rem 1rem;background:#1a1816;border:1px solid rgba(232,215,160,.15);border-radius:4px;color:#d4ccc4;font-family:'Inter',sans-serif;font-size:.875rem;font-weight:300}
.search-input:focus{outline:none;border-color:#e8d7a0}
.search-input::placeholder{color:#3a3530}
.refresh-btn{padding:.75rem 1.25rem;background:transparent;border:1px solid rgba(232,215,160,.2);border-radius:4px;color:#6a6258;font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.refresh-btn:hover{border-color:#e8d7a0;color:#e8d7a0}

/* TABLE */
.table-wrap{background:#1a1816;border:1px solid rgba(232,215,160,.1);border-radius:4px;overflow:hidden}
.results-table{width:100%;border-collapse:collapse}
.results-table th{padding:.75rem 1rem;text-align:left;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;font-weight:400;border-bottom:1px solid rgba(232,215,160,.1);background:#161412;white-space:nowrap}
.results-table td{padding:.9rem 1rem;font-size:.82rem;color:#a09890;border-bottom:1px solid rgba(232,215,160,.06);vertical-align:middle}
.results-table tr:last-child td{border-bottom:none}
.results-table tr:hover td{background:rgba(232,215,160,.03);cursor:pointer}
.score-pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:.72rem;font-weight:500;letter-spacing:.04em}
.score-high{background:rgba(181,196,160,.12);color:#b5c4a0}
.score-mid{background:rgba(232,215,160,.1);color:#e8d7a0}
.score-low{background:rgba(201,122,90,.1);color:#c97a5a}
.name-cell{color:#f0e8df;font-weight:400}
.email-cell{color:#6a6258;font-size:.78rem}
.date-cell{color:#5a5550;font-size:.75rem;white-space:nowrap}
.empty-state{text-align:center;padding:4rem 2rem;color:#5a5550;font-size:.875rem}
.guide-badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c4a882;margin-left:6px;vertical-align:middle}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:#111;border:1px solid rgba(232,215,160,.15);border-radius:6px;width:100%;max-width:740px;position:relative;margin:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid rgba(232,215,160,.1)}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:#f0e8df}
.modal-close{background:none;border:none;color:#5a5550;font-size:1.25rem;cursor:pointer;padding:.25rem}
.modal-close:hover{color:#e8d7a0}
.modal-body{padding:1.5rem;max-height:80vh;overflow-y:auto}

/* TABS */
.tab-row{display:flex;gap:0;border-bottom:1px solid rgba(232,215,160,.1);margin-bottom:1.5rem}
.tab-btn{padding:.6rem 1.25rem;background:none;border:none;border-bottom:2px solid transparent;color:#5a5550;font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.tab-btn.active{color:#e8d7a0;border-bottom-color:#e8d7a0}
.tab-btn:hover{color:#a09890}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* TWO-BAR REALM ROWS */
.realm-block{margin-bottom:1.1rem;padding-bottom:1.1rem;border-bottom:1px solid rgba(232,215,160,.08)}
.realm-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.realm-block-name{font-size:.82rem;color:#b0a898;margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bar-label{font-size:.68rem;color:#5a5550;width:120px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-pct{font-size:.72rem;font-weight:500;width:34px;text-align:right;flex-shrink:0}

/* GUIDE STYLES */
.guide-title-block{text-align:center;padding:1rem 0 2rem;border-bottom:1px solid rgba(232,215,160,.1);margin-bottom:1.5rem}
.guide-main-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:#f0e8df;margin-bottom:.4rem;line-height:1.3}
.guide-subtitle{font-size:.88rem;color:#6a6258;font-style:italic}
.guide-section{margin-bottom:1.75rem;padding-bottom:1.75rem;border-bottom:1px solid rgba(232,215,160,.07)}
.guide-section:last-of-type{border-bottom:none}
.guide-section-hdr{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.guide-section-icon{font-size:1rem;opacity:.7}
.guide-section-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:#6a6258;font-weight:400}
.guide-section-body{font-size:.88rem;color:#c0b8b0;line-height:1.95}
.guide-section-body p{margin-bottom:.85rem}
.guide-section-body p:last-child{margin-bottom:0}
.guide-closing{background:#1a1714;border:1px solid rgba(196,168,130,.2);border-left:3px solid #c4a882;border-radius:4px;padding:1.25rem 1.5rem;margin-top:1.5rem}
.guide-closing-label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-bottom:.6rem}
.guide-closing-text{font-size:.88rem;color:#c0b8b0;line-height:1.9;font-style:italic}
.no-guide{text-align:center;padding:2.5rem 1rem;color:#5a5550;font-size:.85rem}
.no-guide-icon{font-size:2rem;margin-bottom:.75rem;opacity:.3}

/* Loading */
.loading{text-align:center;padding:3rem;color:#5a5550;font-size:.875rem}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8d7a0;margin:0 3px;animation:bounce .8s infinite}
.loading-dot:nth-child(2){animation-delay:.15s}
.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

@media(max-width:768px){
  .stats-row{grid-template-columns:1fr 1fr}
  .dash-body{padding:1rem}
  .results-table th:nth-child(n+5){display:none}
  .results-table td:nth-child(n+5){display:none}
  .modal-overlay{padding:.5rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Bold<span>Hearts</span></div>
    <div class="login-sub">Admin Dashboard</div>
    <div class="login-field">
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-logo">Bold<span>Hearts</span> <span style="font-size:.7rem;color:#5a5550;letter-spacing:.06em;font-family:'Inter',sans-serif;font-weight:300;margin-left:.5rem">Admin</span></div>
    <div style="display:flex;align-items:center;gap:1.5rem">
      <div class="dash-meta" id="dash-meta">Loading...</div>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="dash-body">
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-label">Total Submissions</div><div class="stat-val" id="stat-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Avg Overall Score</div><div class="stat-val" id="stat-avg">—</div></div>
      <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-val" id="stat-month">—</div></div>
      <div class="stat-card"><div class="stat-label">Latest Submission</div><div class="stat-val" id="stat-latest" style="font-size:1.1rem">—</div></div>
    </div>

    <div class="search-row">
      <input type="text" class="search-input" id="search-input" placeholder="Search by name or email..." oninput="filterTable()">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>

    <div class="table-wrap">
      <div class="loading" id="table-loading">
        <div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>
      </div>
      <table class="results-table" id="results-table" style="display:none">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Date</th>
            <th>Overall</th>
            <th>Work</th>
            <th>Family</th>
            <th>Friends</th>
            <th>Community</th>
            <th>God</th>
            <th>Self</th>
            <th>Guide</th>
            <th>Warnings</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none">No submissions found.</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Results</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const PASSWORD = 'boldhearts2026';
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzkQHG-plPkD-5g-_8MngVe5P-lcYaxbMvJg0q3-4uUhegipWpr1N-6CWvui8gXH2FgpQ/exec';

let allRows = [];

function doLogin(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-err');
  if(pw === PASSWORD){
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  } else {
    err.textContent = 'Incorrect password.';
    document.getElementById('pw').value = '';
  }
}

function doLogout(){
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pw').value = '';
  allRows = [];
}

function scoreClass(score){
  const n = parseInt(score);
  if(n >= 70) return 'score-high';
  if(n >= 45) return 'score-mid';
  return 'score-low';
}

function scorePill(val){
  if(!val || val === '') return '<span style="color:#3a3530">—</span>';
  return `<span class="score-pill ${scoreClass(val)}">${val}</span>`;
}

async function loadData(){
  document.getElementById('table-loading').style.display = 'block';
  document.getElementById('results-table').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';

  try {
    const data = await new Promise((resolve, reject) => {
      const cbName = '_bh_read_' + Date.now();
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        reject(new Error('Timeout'));
        try{ delete window[cbName]; script.remove(); }catch(e){}
      }, 10000);
      window[cbName] = (data) => {
        clearTimeout(timeout);
        resolve(data);
        try{ delete window[cbName]; script.remove(); }catch(e){}
      };
      script.src = SHEETS_URL + '?action=read&callback=' + cbName;
      document.head.appendChild(script);
    });

    if(data.rows && data.rows.length > 0){
      allRows = data.rows;
      renderTable(allRows);
      updateStats(allRows);
    } else {
      document.getElementById('table-loading').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
    }
  } catch(e){
    document.getElementById('table-loading').style.display = 'none';
    document.getElementById('empty-state').textContent = 'Error loading data. Make sure the Apps Script is deployed correctly.';
    document.getElementById('empty-state').style.display = 'block';
  }
}

function updateStats(rows){
  document.getElementById('stat-total').textContent = rows.length;
  const scores = rows.map(r => parseInt(r[3])).filter(n => !isNaN(n));
  const avg = scores.length > 0 ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  document.getElementById('stat-avg').textContent = avg + '%';
  const now = new Date();
  const thisMonth = rows.filter(r => {
    const d = new Date(r[0]);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length;
  document.getElementById('stat-month').textContent = thisMonth;
  if(rows.length > 0){
    const latest = new Date(rows[rows.length-1][0]);
    document.getElementById('stat-latest').textContent = latest.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  document.getElementById('dash-meta').textContent = rows.length + ' total submissions';
}

function renderTable(rows){
  document.getElementById('table-loading').style.display = 'none';
  if(rows.length === 0){
    document.getElementById('empty-state').style.display = 'block';
    return;
  }
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = rows.slice().reverse().map((r, i) => {
    const originalIdx = rows.length - 1 - i;
    const date = new Date(r[0]);
    const dateStr = date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    const warnings = r[18] || '—';
    const shortWarnings = warnings.length > 30 ? warnings.substring(0,30)+'...' : warnings;
    const hasGuide = !!(r[24]);
    const guideDot = hasGuide ? '<span class="guide-badge" title="Guide available"></span>' : '';
    return `<tr onclick="showModal(${originalIdx})">
      <td class="name-cell">${r[1]||'—'}${guideDot}</td>
      <td class="email-cell">${r[2]||'—'}</td>
      <td class="date-cell">${dateStr}</td>
      <td>${scorePill(r[3])}</td>
      <td>${scorePill(r[4])}</td>
      <td>${scorePill(r[6])}</td>
      <td>${scorePill(r[7])}</td>
      <td>${scorePill(r[8])}</td>
      <td>${scorePill(r[19])}</td>
      <td>${scorePill(r[20])}</td>
      <td style="font-size:.72rem;color:${hasGuide?'#c4a882':'#3a3530'}">${hasGuide?'✓ Ready':'—'}</td>
      <td style="font-size:.72rem;color:#6a6258">${shortWarnings}</td>
    </tr>`;
  }).join('');
  document.getElementById('results-table').style.display = 'table';
}

function filterTable(){
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = allRows.filter(r =>
    (r[1]||'').toLowerCase().includes(q) ||
    (r[2]||'').toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function showTab(tabId){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tabId));
}

// col indices (0-based): outward/self per realm
// 26=work_outward, 27=work_self, 28=partner_outward, 29=partner_self
// 30=family_outward, 31=family_self, 32=friends_outward, 33=friends_self
// 34=community_outward, 35=community_self

const REALM_DEFS = [
  { label:'Work / School',      overall:4,  outward:26, self:27 },
  { label:'Significant Other',  overall:5,  outward:28, self:29 },
  { label:'Family',             overall:6,  outward:30, self:31 },
  { label:'Friends',            overall:7,  outward:32, self:33 },
  { label:'Community',          overall:8,  outward:34, self:35 },
  { label:'Relationship with God',  overall:19, outward:null, self:null },
  { label:'Relationship with Self', overall:20, outward:null, self:null },
];

function twoBar(outward, self_, label){
  // outward = how others engage you, self_ = how you engage others
  const ov = parseInt(outward) || 0;
  const sv = parseInt(self_)   || 0;
  const oc = ov>=70?'#b5c4a0':ov>=45?'#e8d7a0':'#c97a5a';
  const sc = sv>=70?'#b5c4a0':sv>=45?'#9aa8b0':'#c97a5a';
  return `<div class="realm-block-name">${label}</div>
    <div class="bar-row">
      <div class="bar-label">Others → You</div>
      <div class="bar-track"><div class="bar-fill" style="width:${ov}%;background:${oc}"></div></div>
      <div class="bar-pct" style="color:${oc}">${outward||'—'}</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">You → Others</div>
      <div class="bar-track"><div class="bar-fill" style="width:${sv}%;background:${sc}"></div></div>
      <div class="bar-pct" style="color:${sc}">${self_||'—'}</div>
    </div>`;
}

function singleBar(val, label){
  const n = parseInt(val) || 0;
  const col = n>=70?'#b5c4a0':n>=45?'#c4a882':'#c97a5a';
  return `<div class="realm-block-name">${label}</div>
    <div class="bar-row">
      <div class="bar-label">Overall</div>
      <div class="bar-track"><div class="bar-fill" style="width:${n}%;background:${col}"></div></div>
      <div class="bar-pct" style="color:${col}">${val||'—'}</div>
    </div>`;
}

function renderGuidePanel(r){
  const guideJson = r[24];
  if(!guideJson){
    return `<div class="no-guide">
      <div class="no-guide-icon">📋</div>
      <div>No spiritual direction guide generated yet.</div>
      <div style="margin-top:.5rem;font-size:.75rem;color:#3a3530">Guide is created when ${r[1]||'this person'} completes the Deep Dive assessment.</div>
    </div>`;
  }
  let guide;
  try { guide = JSON.parse(guideJson); }
  catch(e){ return `<div class="no-guide"><div>Guide data could not be parsed.</div></div>`; }

  const sections = (guide.sections || []).map(s => {
    const paragraphs = (s.content || '').split(/\n\n+/).map(p => `<p>${p.trim()}</p>`).join('');
    return `<div class="guide-section">
      <div class="guide-section-hdr">
        <span class="guide-section-icon">${s.icon||''}</span>
        <span class="guide-section-label">${s.label||''}</span>
      </div>
      <div class="guide-section-body">${paragraphs}</div>
    </div>`;
  }).join('');

  const closing = guide.closingNote
    ? `<div class="guide-closing">
        <div class="guide-closing-label">A Note from Steve</div>
        <div class="guide-closing-text">${guide.closingNote}</div>
       </div>`
    : '';

  const guideDate = r[25] ? `<div style="font-size:.68rem;color:#3a3530;margin-top:.5rem">Generated ${new Date(r[25]).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>` : '';

  return `<div class="guide-title-block">
    <div class="guide-main-title">${guide.title||'Spiritual Direction Guide'}</div>
    <div class="guide-subtitle">${guide.subtitle||''}</div>
    ${guideDate}
  </div>
  ${sections}
  ${closing}`;
}

function showModal(idx){
  const r = allRows[idx];
  if(!r) return;

  document.getElementById('modal-title').textContent = (r[1]||'Unknown') + "'s Results";

  const dimCols = [
    {label:'Being Seen',           idx:9},
    {label:'Being Known',          idx:10},
    {label:'Having a Voice',       idx:11},
    {label:'Belonging',            idx:12},
    {label:'Receiving Support',    idx:13},
    {label:'Trust & Safety',       idx:14},
    {label:'Being Chosen',         idx:15},
    {label:'Freedom to Be Myself', idx:16},
  ];

  function bar(pct){
    const n = parseInt(pct)||0;
    const col = n>=70?'#b5c4a0':n>=45?'#e8d7a0':'#c97a5a';
    return `<div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden">
        <div style="width:${n}%;height:100%;background:${col};border-radius:3px"></div>
      </div>
      <span style="font-size:.75rem;color:${col};width:36px;text-align:right">${pct||'—'}</span>
    </div>`;
  }

  const date = new Date(r[0]).toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  const hasGuide = !!(r[24]);

  // Build realm rows — two bars where outward/self data exists
  const realmRowsHtml = REALM_DEFS.map(rd => {
    const hasData = r[rd.overall] && r[rd.overall] !== '';
    if(!hasData) return '';
    let content;
    if(rd.outward !== null && r[rd.outward] && r[rd.outward] !== ''){
      content = twoBar(r[rd.outward], r[rd.self], rd.label);
    } else {
      content = singleBar(r[rd.overall], rd.label);
    }
    return `<div class="realm-block">${content}</div>`;
  }).join('');

  // ── SCORES TAB ──
  const scoresHtml = `
    <div style="text-align:center;padding:1rem 0 1.5rem;border-bottom:1px solid rgba(232,215,160,.1);margin-bottom:1.5rem">
      <div style="font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:${parseInt(r[3])>=70?'#b5c4a0':parseInt(r[3])>=45?'#e8d7a0':'#c97a5a'}">${r[3]||'—'}</div>
      <div style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-top:.25rem">Overall Score</div>
      <div style="font-size:.78rem;color:#5a5550;margin-top:.5rem">${date}</div>
      <div style="font-size:.78rem;color:#6a6258;margin-top:.25rem">${r[2]||''}</div>
    </div>

    <div style="margin-bottom:1.5rem">
      <div style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid rgba(232,215,160,.08)">Scores by Realm</div>
      <div style="font-size:.68rem;color:#3a3530;margin-bottom:.75rem;display:flex;gap:1.5rem">
        <span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:10px;height:3px;background:#e8d7a0;border-radius:2px"></span>Others → You</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:10px;height:3px;background:#9aa8b0;border-radius:2px"></span>You → Others</span>
      </div>
      ${realmRowsHtml}
    </div>

    <div style="margin-bottom:1.5rem">
      <div style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid rgba(232,215,160,.08)">Connection Dimensions</div>
      ${dimCols.map(c=>`
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:.6rem">
          <div style="width:140px;font-size:.78rem;color:#6a6258;text-align:right;flex-shrink:0">${c.label}</div>
          <div style="flex:1">${bar(r[c.idx])}</div>
        </div>`).join('')}
    </div>

    <div style="margin-bottom:1.5rem">
      <div style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid rgba(232,215,160,.08)">Engagement Patterns</div>
      ${(r[17]||'—').split(' | ').map(p=>`<div style="font-size:.82rem;color:#a09890;margin-bottom:.4rem">• ${p}</div>`).join('')}
    </div>

    <div style="margin-bottom:1.5rem">
      <div style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:#5a5550;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid rgba(232,215,160,.08)">Warning Signs</div>
      ${(r[18]||'None').split(' | ').map(w=>`<div style="font-size:.82rem;color:#c97a5a;margin-bottom:.4rem">• ${w}</div>`).join('')}
    </div>

    <div style="padding-top:1.5rem;border-top:1px solid rgba(196,168,130,.1);text-align:center">
      <a href="mailto:${r[2]}?subject=Your BoldHearts Deep Dive Assessment&body=Hi ${r[1]},%0D%0A%0D%0AThank you for completing the Heart Engagement Assessment. Based on our conversation, I'd like to invite you to complete the Deep Dive — the final two foundational layers of your assessment.%0D%0A%0D%0AClick here to begin:%0D%0Ahttps://boldhearts.org/deepdive.html%0D%0A%0D%0AUse the same email address you used for your first assessment so we can combine your complete results.%0D%0A%0D%0AThis is where the picture comes together.%0D%0A%0D%0AI'm for you,%0D%0ASteve Forney%0D%0ABoldHearts" style="display:inline-block;background:#c4a882;color:#111;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:.75rem 1.75rem;border-radius:4px;text-decoration:none">Send Deep Dive Invitation</a>
      <div style="font-size:.72rem;color:#5a5550;margin-top:.6rem">Opens a pre-filled email to ${r[1]||'this person'}</div>
    </div>`;

  document.getElementById('modal-body').innerHTML = `
    <div class="tab-row">
      <button class="tab-btn active" data-tab="scores" onclick="showTab('scores')">Scores &amp; Patterns</button>
      <button class="tab-btn" data-tab="guide" onclick="showTab('guide')">
        Spiritual Direction Guide${hasGuide?' <span style="color:#c4a882">✓</span>':''}
      </button>
    </div>
    <div class="tab-panel active" id="tab-scores">${scoresHtml}</div>
    <div class="tab-panel" id="tab-guide">${renderGuidePanel(r)}</div>
  `;

  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
  if(e.key === 'Enter' && document.getElementById('login-wrap').style.display !== 'none') doLogin();
});
</script>
</body>
</html>
